<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <h1>This is Rock Paper Scissor game</h1>
    <p>Select Your Move:</p>
    <button class="move" id="rock-button">Rock</button>
    <button class="move" id="paper-button">Paper</button>
    <button class="move" id="scissor-button">Scissor</button>
    <p id="human-move">Your's move:</p>
    <p id="game-move">Computer's move:</p>
    <p id="victor">Victor:</p>
    <p id="computer-score">Computer Score:</p>
    <p id="human-score">Human Score:</p>
    <button class="restart">Restart</button>
</body>
<script src="game.js"></script>
</html>
