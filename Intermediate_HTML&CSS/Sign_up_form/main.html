<!DOCTYPE html>
<html lang="en">
<head>
    <link href="main.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Sign Up Form</title>
</head>
<body>
    <img id='image' src="image.png">
    <div id="main-content">
        <div id="top-text">
            <h4 class="text text1">This is not a real online service! You know you need something like this in your real life to help you realize your deepest dreams.</h4>
            <h4 class="text text2">Sign up now to get started.</h4>
            <h4 class="text text3">You know you want to.</h4>
        </div>
        <div id="input-form">
            <h2 id="input-form-text">Let's do this!</h2>
            <form id="signup-form" action="post">
                <div id="input1">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name">
    
                    <label for="e-mail">EMAIL</label>
                    <input type="email" id="e-mail">
    
                    <label for="pswd">PASSWORD</label>
                    <input type="password" id="pswd">
                </div>
                <div id="input2">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name"> 
    
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name">    
    
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name">                
                </div>
            </form>
        </div>
        <div id="submit">
            <button id="submit-button" type='submit' form="signup-form">Create Account</button>
            <p id="login-text">
                Already have an account? Log In
            </p>
        </div>
    </div>
</body>
</html>
