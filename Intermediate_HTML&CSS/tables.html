<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>First Header</th>
            <th>This is a data cell</th>
        </tr>

        <tr>
            <td>First Header</td>
            <td>This is also a data cell</td>
        </tr>
    </table>
</body>
</html>
