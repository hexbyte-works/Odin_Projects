<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="text-box">
        <div class="text">item1</div>
        <div class="text">item2</div>
        <div class="text">item3</div>
        <div class="text">item4</div>
        <div class="text">item5</div>
        <div class="text">item6</div>
        <div class="text">item7</div>
        <div class="text">item8</div>
        <div class="text">item9</div>
        <div class="text">item10</div>
    </div>
    <div class="bento-box">
        <div class="box" style="grid-area:box1">1</div>
        <div class="box" style="grid-area:box2">2</div>
        <div class="box" style="grid-area:box3">3</div>
        <div class="box" style="grid-area:box4">4</div>
        <div class="box" style="grid-area:box5">5</div>
    </div>
</body>
</html>
