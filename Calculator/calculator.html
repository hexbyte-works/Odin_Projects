<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <h1>Calculator</h1>
    <form>
        <input id="answer" placeholder="Please Enter" type="text">
    </form>
    <div class="row">
        <div class="button" id="button1">1</div>
        <div class="button" id="button2">2</div>
        <div class="button" id="button3">3</div>
        <div class="button" id="add-button">+</div>
    </div>
    <div class="row">
        <div class="button" id="button4">4</div>
        <div class="button" id="button5">5</div>
        <div class="button" id="button6">6</div>     
        <div class="button" id="minus-button">-</div>     
    </div>
    <div class="row">
        <div class="button" id="button7">7</div>
        <div class="button" id="button8">8</div>
        <div class="button" id="button9">9</div>    
        <div class="button" id="multiply-button">*</div>    
    </div>
    <div class="row">
        <div class="text-button" id="clear-button">Clear</div>
        <div class="button" id="button0">0</div>
        <div class="button" id="answer-button">=</div>
        <div class="button" id="divide-button">/</div>
    </div>
</body>
<script src="calculator.js"></script>
</html>
